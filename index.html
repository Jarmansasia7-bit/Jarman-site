<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarman Sasia | Official</title>
    <style>
        :root { --accent: #ffeb3b; }
        body {
            background: #000 url('https://images.unsplash.com/photo-1484417894907-623942c8ee29?q=80&w=1920') no-repeat center center fixed;
            background-size: cover; margin: 0; font-family: sans-serif; color: #fff;
            display: flex; flex-direction: column; align-items: center;
        }
        .marquee-top { background: #d32f2f; color: white; padding: 10px; width: 100%; position: fixed; top: 0; font-weight: bold; z-index: 10; }
        .container { 
            background: rgba(15, 15, 15, 0.95); padding: 20px; border-radius: 20px; 
            max-width: 450px; width: 90%; margin: 80px auto 30px; text-align: center; 
            border: 1px solid #444; box-shadow: 0 10px 30px rgba(0,0,0,1);
        }
        h1 { color: var(--accent); margin: 5px 0; }
        .section-title { color: var(--accent); border-bottom: 2px solid var(--accent); margin: 25px 0 15px; padding-bottom: 5px; }
        .blog-post { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: left; border-left: 4px solid var(--accent); }
        .yt-btn { background: #ff0000; color: #fff !important; padding: 10px 20px; text-decoration: none; border-radius: 8px; display: inline-block; font-weight: bold; margin-top: 10px; }
        .map-box { border-radius: 15px; overflow: hidden; border: 2px solid var(--accent); margin: 15px 0; height: 250px; background: #111; }
        .contact-btn { background: #25d366; color: white; padding: 12px 25px; text-decoration: none; border-radius: 50px; display: inline-block; margin-top: 10px; font-weight: bold; }
        .counter-box { margin-top: 25px; background: #111; padding: 15px; border-radius: 15px; border: 1px solid #333; }
        .search-box { background: #222; padding: 10px; border-radius: 50px; border: 1px solid var(--accent); display: flex; align-items: center; margin: 20px 0; }
        .search-input { background: transparent; border: none; color: white; padding: 8px 15px; width: 75%; outline: none; }
        .search-btn { background: var(--accent); border: none; padding: 8px 15px; border-radius: 50px; cursor: pointer; font-weight: bold; width: 25%; color: black; }
    </style>
</head>
<body>

    <marquee class="marquee-top" id="mq-main">ਗੁਰਤੇਜ ਸਿੰਘ ਸਾਸੀਆ (ਜਰਮਨ ਸਿੰਘ) ਦੀ ਵੈੱਬਸਾਈਟ 'ਤੇ ਤੁਹਾਡਾ ਸਵਾਗਤ ਹੈ।</marquee>
    
    <div style="margin-top: 65px; margin-bottom: 15px; display: flex; justify-content: center; gap: 8px;">
        <button onclick="changeLang('pa')" id="btn-pa" style="background: var(--accent); border: 1px solid var(--accent); color: black; padding: 8px 12px; cursor: pointer; border-radius: 8px; font-weight: bold;">ਪੰਜਾਬੀ</button>
        <button onclick="changeLang('en')" id="btn-en" style="background: rgba(255,255,255,0.15); border: 1px solid #fff; color: #fff; padding: 8px 12px; cursor: pointer; border-radius: 8px; font-weight: bold;">English</button>
        <button onclick="changeLang('hi')" id="btn-hi" style="background: rgba(255,255,255,0.15); border: 1px solid #fff; color: #fff; padding: 8px 12px; cursor: pointer; border-radius: 8px; font-weight: bold;">हिन्दी</button>
    </div>
    
    <div class="container">
        <h1 id="main-name"> ਜਰਮਨ ਸਾਸੀਆ</h1>
        <p style="color:#00ffcc; font-weight:bold;">(ਜਰਮਨ ਸਿੰਘ)</p>

        <form action="https://www.google.com/search" method="GET" target="_blank" class="search-box">
            <input type="text" name="q" id="search-in" placeholder="ਗੂਗਲ 'ਤੇ ਸਰਚ ਕਰੋ..." required class="search-input">
            <button type="submit" id="search-bt" class="search-btn">ਖੋਜੋ</button>
        </form>

    <div style="background: #ffffff; color: #000; padding: 20px; border-radius: 15px; text-align: center; margin: 20px auto; max-width: 320px; font-family: sans-serif; border: 4px solid #FF9900;">
</div> 
        <h2 class="section-title" id="loc-title">My Village: Hussainpura</h2>
        <div class="map-box">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d13745.3456789!2d75.9221!3d30.6055!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3910609395982875%3A0xc3f587d465d64f1c!2sHussainpura%2C%20Punjab%20148022!5e0!3m2!1sen!2sin!4v1700000000000" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>

        <a href="https://wa.me/918146014073" class="contact-btn" id="wa-btn">WhatsApp Chat</a>

   <div class="counter-box">
    <p id="vst-txt" style="color:var(--accent); font-weight:bold; margin-bottom:10px;">Visitors Count (ਵਿਜ਼ਿਟਰ)</p>
    <img src="https://count.getloli.com/get/@gurtej-singh-sasia?theme=moebooru" alt="Visitor Counter" />
</div>     
    <script>
        // ਭਾਸ਼ਾ ਬਦਲਣ ਤੋਂ ਬਾਅਦ ਲਾਈਕ ਬਟਨ ਨੂੰ ਦੁਬਾਰਾ ਲੋਡ ਕਰਨ ਲਈ
if (window.lyket) { window.lyket.load(); }
    function changeLang(lang) {
        if (lang === 'pa') { location.reload(); return; }

        const data = {
            en: {
                mq: "Welcome to Gurtej Singh Sasia's Website!",
                name: "Gurtej Singh Sasia",
                search: "Search on Google...",
                searchBtn: "Search",
                locT: "My Village: Hussainpura",
                wa: "WhatsApp Chat",
                vst: "Total Visitors"
            },
            hi: {
                mq: "गुरतेज सिंह सासिया की वेबसाइट पर आपका स्वागत है!",
                name: "गुरतेज सिंह सासिया",
                search: "गूगल पर खोजें...",
                searchBtn: "खोजें",
                locT: "मेरा गाँव: हुसैनपुरा",
                wa: "व्हाट्सएप चैट",
                vst: "कुल विज़िटर"
            }
        };

        const t = data[lang];
        document.getElementById('mq-main').innerText = t.mq;
        document.getElementById('main-name').innerText = t.name;
        document.getElementById('search-in').placeholder = t.search;
        document.getElementById('search-bt').innerText = t.searchBtn;
        document.getElementById('next-up-txt').innerText = t.nextUp;
        document.getElementById('blog-title').innerText = t.blogT;
        document.getElementById('b1-h').innerText = t.b1h;
        document.getElementById('b1-p').innerText = t.b1p;
        document.getElementById('b2-h').innerText = t.b2h;
        document.getElementById('b2-p').innerText = t.b2p;
        document.getElementById('b3-h').innerText = t.b3h;
        document.getElementById('b3-p').innerText = t.b3p;
        document.getElementById('loc-title').innerText = t.locT;
        document.getElementById('wa-btn').innerText = t.wa;
        document.getElementById('vst-txt').innerText = t.vst;
    }
    </script>
        <script src="https://unpkg.com/@lyket/widget@latest/dist/lyket.js"></script>
</body>
</html>
